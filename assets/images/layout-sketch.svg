<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Quake and Landmark Radar Frontend Layout Wireframe">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
      .card { fill: #1e293b; stroke: #475569; stroke-width: 1; }
      .accent { fill: #38bdf8; }
      .accent-stroke { stroke: #38bdf8; fill: none; }
      .green { fill: #22c55e; }
      .orange { fill: #f97316; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
      .label { fill: #94a3b8; font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; }
      .value { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
      .mono { fill: #38bdf8; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
      .note { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect class="bg" x="0" y="0" width="960" height="580" rx="12" />

  <!-- Top Header / HUD Bar -->
  <rect class="panel" x="16" y="16" width="928" height="68" rx="8" />
  <circle class="accent" cx="40" cy="50" r="7" />
  <text class="title" x="58" y="47">Quake &amp; Landmark Radar</text>
  <text class="subtitle" x="58" y="64">Spatial Clue &amp; Coordinate Challenge</text>

  <!-- HUD Stat Boxes -->
  <g transform="translate(500, 28)">
    <rect class="card" x="0" y="0" width="78" height="44" rx="6" />
    <text class="label" x="39" y="16" text-anchor="middle">ROUND</text>
    <text class="value" x="39" y="34" text-anchor="middle">4 / 10</text>

    <rect class="card" x="88" y="0" width="78" height="44" rx="6" />
    <text class="label" x="127" y="16" text-anchor="middle">TIME</text>
    <text class="value" x="127" y="34" text-anchor="middle" fill="#38bdf8">47s</text>

    <rect class="card" x="176" y="0" width="78" height="44" rx="6" />
    <text class="label" x="215" y="16" text-anchor="middle">SCORE</text>
    <text class="value" x="215" y="34" text-anchor="middle">2,850</text>

    <rect class="card" x="264" y="0" width="78" height="44" rx="6" />
    <text class="label" x="303" y="16" text-anchor="middle">LIVES</text>
    <text class="value" x="303" y="34" text-anchor="middle" fill="#fb7185">♥♥♡</text>

    <rect class="card" x="352" y="0" width="78" height="44" rx="6" />
    <text class="label" x="391" y="16" text-anchor="middle">BEST</text>
    <text class="value" x="391" y="34" text-anchor="middle">5,420</text>
  </g>

  <!-- Temporal Progress Bar -->
  <rect fill="#1e293b" x="16" y="88" width="928" height="6" rx="3" />
  <rect class="accent" x="16" y="88" width="690" height="6" rx="3" />

  <!-- Left Mission Briefing Panel -->
  <rect class="panel" x="16" y="102" width="290" height="426" rx="8" />
  <rect fill="#1e3a5f" stroke="#38bdf8" stroke-width="1" x="32" y="118" width="128" height="22" rx="11" />
  <text class="mono" x="96" y="133" text-anchor="middle">Level 2 · Regional</text>
  <text class="label" x="288" y="133" text-anchor="end" fill="#f97316">SEISMIC ZONE</text>

  <text class="title" x="32" y="170">Target #4</text>
  <text class="mono" x="32" y="190">Tolerance: 550 km · Bonus: +3s</text>

  <!-- Clue Text Placeholder -->
  <text class="note" x="32" y="218">Spatial Clue Area:</text>
  <rect class="card" x="32" y="226" width="258" height="72" rx="6" />
  <text class="subtitle" x="44" y="248">Western segment of a 1,500 km</text>
  <text class="subtitle" x="44" y="264">strike-slip fault bordering the</text>
  <text class="subtitle" x="44" y="280">eastern Sea of Marmara...</text>

  <!-- Feedback / Fact Card -->
  <rect fill="#14532d" fill-opacity="0.45" stroke="#22c55e" stroke-width="1" x="32" y="310" width="258" height="86" rx="6" />
  <text class="value" x="44" y="330" fill="#4ade80" font-size="12">Target Locked! 142 km (+980 pts)</text>
  <text class="subtitle" x="44" y="350">Haversine feedback + geographic</text>
  <text class="subtitle" x="44" y="366">fact displayed after map click.</text>
  <text class="subtitle" x="44" y="382">Speed &amp; streak bonuses applied.</text>

  <!-- Action Buttons -->
  <rect class="green" x="32" y="414" width="258" height="36" rx="6" />
  <text class="value" x="161" y="437" text-anchor="middle" fill="#052e16">Next Target →</text>

  <rect class="card" x="32" y="460" width="124" height="34" rx="6" />
  <text class="note" x="94" y="481" text-anchor="middle">Reset View</text>

  <rect class="card" x="166" y="460" width="124" height="34" rx="6" />
  <text class="note" x="228" y="481" text-anchor="middle">Switch Basemap</text>

  <text class="subtitle" x="161" y="514" text-anchor="middle">Post-Game: Chart.js Analytics Modal</text>

  <!-- Right Interactive Leaflet Map Area -->
  <rect class="panel" x="318" y="102" width="626" height="426" rx="8" />

  <!-- Subtle Graticule Lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="318" y1="208" x2="944" y2="208" />
    <line x1="318" y1="315" x2="944" y2="315" />
    <line x1="318" y1="422" x2="944" y2="422" />
    <line x1="474" y1="102" x2="474" y2="528" />
    <line x1="631" y1="102" x2="631" y2="528" />
    <line x1="788" y1="102" x2="788" y2="528" />
  </g>

  <!-- Map Title Watermark -->
  <text class="label" x="336" y="124">INTERACTIVE LEAFLET.JS MAP CANVAS (NO-LABEL BASEMAP)</text>

  <!-- Target Tolerance Circle & Pulse Rings -->
  <circle cx="675" cy="278" r="76" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="675" cy="278" r="24" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.65" />
  <circle cx="675" cy="278" r="14" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.85" />
  <circle cx="675" cy="278" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="2" />
  <text class="note" x="690" y="264" fill="#4ade80">Actual Target (GeoJSON)</text>

  <!-- Player Guess Pin & Pulse -->
  <circle cx="545" cy="336" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
  <circle cx="545" cy="336" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  <text class="note" x="456" y="362" fill="#38bdf8">Player Click Guess</text>

  <!-- Dashed Haversine Distance Polyline -->
  <line x1="545" y1="336" x2="675" y2="278" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="8 6" />
  <rect class="panel" x="582" y="294" width="66" height="22" rx="4" />
  <text class="mono" x="615" y="309" text-anchor="middle">142 km</text>

  <!-- Map Controls & Coordinate Readout -->
  <rect class="card" x="334" y="486" width="90" height="26" rx="4" />
  <text class="subtitle" x="379" y="503" text-anchor="middle">Scale (km)</text>

  <rect class="card" x="760" y="486" width="168" height="26" rx="4" />
  <text class="mono" x="844" y="503" text-anchor="middle">Lat: 40.77°, Lon: 29.92°</text>

  <!-- Footer -->
  <rect class="panel" x="16" y="538" width="928" height="28" rx="6" />
  <text class="subtitle" x="30" y="556">GMT 458 – Web GIS | GeoGame Project</text>
  <text class="subtitle" x="930" y="556" text-anchor="end">Basemap: CartoDB &amp; OpenStreetMap contributors</text>
</svg>
